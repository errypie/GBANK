<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-BANK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/ico.png')}}" type="image/x-icon">
</head>
<body>
    <header>
        <div class="logo">
            <a href="{{ url_for('home')}}"><img src="{{ url_for('static', filename='images/logo.png')}}" alt="Bank Logo"></a>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('home')}}">Банк</a></li>
                <li><a href="{{ url_for('add_money')}}">Бесплатно деньги</a></li>
                <li><a href="{{ url_for('transfer')}}">Переводы</a></li>
                <li><a href="{{ url_for('transactions')}}">Транзакции</a></li>
                <li><a href="{{ url_for('richest')}}">TOP-10</a></li>
            </ul>
        </nav>
        <!-- Если пользователь авторизован, показываем его имя и иконку профиля -->
        {% if current_user.is_authenticated %}
        <a class="user-name" href="{{ url_for('profile') }}"><div class="user-profile">
            <span>{{ current_user.username }}</span>
            <img src="{{ url_for('static', filename='images/player.png')}}" alt="User Profile">
        </div></a>
        {% else %}
        <!-- Если пользователь не авторизован, можем показать кнопку входа -->
        <div class="user-profile">
            <a href="{{ url_for('login') }}">Войти</a>
            <a href="{{ url_for('register') }}">Зарегистрироваться</a>
        </div>
        {% endif %}
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
